name: Security CodeQL actions scan
on:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * MON-FRI" # Every weekday

jobs:
  security-codeql-actions-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security CodeQL actions scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_codeql_actions.yml@1b2c7e2e44928de36bd82487d2b61cc8f0cc8294 # v2.23.5
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit

