name: Security OWASP dependency check
on:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * MON-FRI" # Every weekday

jobs:
  security-kotlin-owasp-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Kotlin security OWASP dependency check
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_owasp.yml@2a7bb1a9bdaa0ebad11f03538dbcf396ba3b7779 # v2.19.0
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
      nvd_feed_version: '2'
    secrets: inherit
